name: Bake 3D scenes

# Bakes Vert scenes for runs that do not have one yet and commits them.
#
# This is only a safety net: the COROS sync workflow already bakes terrain for
# fresh activities (last 7 days) as part of its own run, so a new run usually
# gets its 3D scene the same morning. A weekly sweep catches whatever a sync
# pass missed (failed bake, scene pruned, run imported later) without paying
# for a daily pnpm install.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1' # Mondays 11:30 Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: bake-scenes
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake new scenes
        run: pnpm bake:scenes --prune

      - name: Commit new scenes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scenes src/static/scenes.json
          if git diff --cached --quiet; then
            echo "No new scenes"
            exit 0
          fi
          git commit -m "chore: bake 3D scenes"
          git pull --rebase origin master
          git push
