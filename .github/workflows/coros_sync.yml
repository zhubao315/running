name: COROS Sync

# Sync from the official COROS MCP gateway, then rebuild and deploy the page.
# Data is committed back to master so history never depends on the Actions
# cache (the old cache-based workflow lost months of data when the Strava
# token expired).
#
# Cost control: around three runs a week means one scheduled pass a day is
# plenty (the sync window always starts at newest activity - 2 days, so a
# missed day is recovered by the next one). A pass that downloads nothing new
# skips the rebuild and the Pages deploy; pushes never talk to COROS at all.

on:
  workflow_dispatch:
    inputs:
      reserve_budget:
        description: FIT downloads to reserve from the shared 50/day COROS quota
        required: false
        default: '10'
  schedule:
    # 02:10 Asia/Shanghai — six hours ahead of the old 08:10 slot: GitHub
    # fired that trigger 5-7 h late every day in November, so the site
    # updated after lunch; this slot lands near 08:10 Beijing anyway.
    - cron: '10 18 * * *'
  push:
    branches:
      - master
    paths:
      # Everything that can change the built page has to be listed here: a
      # path that is missing means a change to it never reaches the page.
      - run_page/coros_mcp_sync.py
      - run_page/update_readme_stats.py
      - requirements.txt
      - src/**
      - assets/**
      - plugins/**
      - scripts/**
      - public/**
      - package.json
      - pnpm-lock.yaml
      - vite.config.ts
      - tsconfig.json
      - vite-env.d.ts
      - tailwind.config.js
      - postcss.config.js
      - README.md
      - index.html
      - .github/workflows/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coros-sync
  cancel-in-progress: false

env:
  ATHLETE: zhubao315
  TITLE: zhubao315's Running
  TITLE_GRID: Over 20km Runs
  MIN_GRID_DISTANCE: 20

jobs:
  sync:
    name: Sync COROS data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # COROS only allows 50 FIT downloads a day for the whole account, shared
      # with cycling and hiking. Pushes (UI tweaks, code, and the bot's own
      # data commit) therefore never touch the network: only the schedule and
      # manual dispatch do. This also stops the bot's commit from retriggering
      # a full rebuild of the pipeline that produced it.
      - name: Decide whether this run syncs
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      # COROS gives this account 50 FIT downloads a day, shared by all three
      # sport sites. Claim today's share in the shared ledger before syncing
      # (default 10; raise reserve_budget on a manual backfill run) and hand
      # the allowance to the sync. Ledger trouble degrades to a small static
      # budget — the sync never fails because of the quota bookkeeping.
      - name: Claim today's share of the shared COROS quota
        id: quota
        if: steps.gate.outputs.run == 'true'
        env:
          ACTIVE_STATE_TOKEN: ${{ secrets.ACTIVE_STATE_TOKEN }}
          QUOTA_RESERVE: ${{ github.event.inputs.reserve_budget || '10' }}
        run: |
          ALLOW=$(python3 scripts/quota_lease.py reserve --repo running --want "$QUOTA_RESERVE" --cap 45)
          echo "allow=${ALLOW:-10}" >> "$GITHUB_OUTPUT"

      - name: Sync from COROS MCP
        id: sync
        if: steps.gate.outputs.run == 'true'
        run: |
          set -o pipefail
          python run_page/coros_mcp_sync.py \
            --account "${{ secrets.COROS_ACCOUNT }}" \
            --password "${{ secrets.COROS_PASSWORD }}" \
            --max-downloads "${{ steps.quota.outputs.allow }}" 2>&1 | tee "$RUNNER_TEMP/coros_sync.log"
          fetched=$(grep -oE 'fetched [0-9]+ new FIT' "$RUNNER_TEMP/coros_sync.log" \
            | tail -n1 | grep -oE '[0-9]+' || true)
          echo "fetched=${fetched:-unknown}" >> "$GITHUB_OUTPUT"
        # The daily 50-FIT allowance is shared across the sport sites; the
        # quota step above divides it, and anything left over is picked up by
        # the next run (the sync window always starts at newest - 2 days).

      # Give back what the run did not need so the other sites can use it
      # today. `fetched` counts downloaded FIT files; "unknown" (log format
      # drift) simply leaves the reservation standing.
      - name: Reconcile the quota ledger with what was fetched
        if: steps.gate.outputs.run == 'true' && steps.quota.outputs.allow != ''
        continue-on-error: true
        env:
          ACTIVE_STATE_TOKEN: ${{ secrets.ACTIVE_STATE_TOKEN }}
        run: |
          fetched="${{ steps.sync.outputs.fetched }}"
          case "$fetched" in ''|unknown|*[!0-9]*) exit 0;; esac
          python3 scripts/quota_lease.py reconcile --repo running --used "$fetched"

      - name: Check whether anything new arrived
        id: change
        if: steps.gate.outputs.run == 'true'
        run: |
          fetched="${{ steps.sync.outputs.fetched }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$fetched" ] || [ "$fetched" != "0" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "no new activities (0 FIT) — skipping the rebuild and deploy"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep the duplicate manifest current, then remove the records it lists.
      # The watch files hikes as a running sport type, so without this the same
      # session is counted both here and on the hiking site.
      #
      # Refresh reads the hiking site's published dataset and appends any new
      # pair, so a hike taken yesterday is excluded without anyone noticing it
      # first; the manifest used to be hand-maintained. Matching is on start
      # time and distance only — run_id values are not shared between the two
      # repositories and the activity name is not a discriminator.
      # --soft-fail: a transient fetch error leaves the manifest as committed
      # (the pre-automation behaviour) rather than failing the whole sync run.
      # Entries are only ever added, because an entry whose record is gone IS
      # the exclusion and deleting it would resurrect it.
      #
      # Both steps must run BEFORE the SVG charts, README stats and parquet
      # export so those artefacts derive from the cleaned dataset, and the
      # exclude step must follow the refresh to act on the fresh entries.
      - name: Refresh hiking duplicate manifest
        if: steps.change.outputs.rebuild == 'true'
        run: python run_page/refresh_hiking_duplicates.py --execute --soft-fail

      - name: Exclude hiking duplicates
        if: steps.change.outputs.rebuild == 'true'
        run: python run_page/exclude_hiking_dupes_rh.py --execute

      - name: Regenerate SVG charts
        if: steps.change.outputs.rebuild == 'true'
        run: |
          python run_page/gen_svg.py --from-db --title "${{ env.TITLE }}" --type github --github-style "align-firstday" --athlete "${{ env.ATHLETE }}" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output assets/github.svg --use-localtime --min-distance 0.5
          python run_page/gen_svg.py --from-db --title "${{ env.TITLE_GRID }}" --type grid --athlete "${{ env.ATHLETE }}" --output assets/grid.svg --special-color yellow --special-color2 red --special-distance 20 --special-distance2 40 --use-localtime --min-distance "${{ env.MIN_GRID_DISTANCE }}"
          python run_page/gen_svg.py --from-db --type circular --use-localtime
          python run_page/gen_svg.py --from-db --year $(date +"%Y") --language zh_CN --title "$(date +"%Y") Running" --type github --github-style "align-firstday" --athlete "${{ env.ATHLETE }}" --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --output "assets/github_$(date +"%Y").svg" --use-localtime --min-distance 0.5

      - name: Set up Node.js for 3D baking
        if: steps.change.outputs.rebuild == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm for 3D baking
        if: steps.change.outputs.rebuild == 'true'
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Install Node dependencies
        if: steps.change.outputs.rebuild == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bake 3D terrain for new activities
        if: steps.change.outputs.rebuild == 'true'
        run: node scripts/bake-scenes.mjs --since "$(date -u -d '7 days ago' +%F)" --limit 30

      # The watch never reported a climb, but every baked scene carries the
      # route's elevation: recover the climb from the terrain and write it
      # back into both copies of the data (the JSON the page reads and the
      # database it is rebuilt from).
      - name: Backfill the climb from the baked terrain
        if: steps.change.outputs.rebuild == 'true'
        run: |
          node scripts/backfill-scene-records.mjs
          python scripts/sync_scene_records_db.py .

      # Node read the JSON above through JSON.parse, which has no integer
      # above 2^53: the 19-digit COROS ids came back as the nearest double
      # ("...807" -> "...000"). The browser rounds the same way, so the page
      # is fine with it — but the integrity gate and the GPS-drift allowlist
      # below join the JSON with the DB, and SQLite holds the exact INTEGER.
      # Restore the ids from the DB so both sides speak the same ones again.
      - name: Repair JS-rounded run_ids
        if: steps.change.outputs.rebuild == 'true'
        run: python run_page/repair_run_ids_rh.py --execute

      - name: Export parquet snapshot
        if: steps.change.outputs.rebuild == 'true'
        run: |
          pip install duckdb
          python run_page/save_to_parqent.py

      - name: Update README stats
        if: steps.change.outputs.rebuild == 'true'
        run: python run_page/update_readme_stats.py --sport running

      # Targeted cleanup of confirmed GPS-drift artifacts (joyrun imports).
      # Per-case component drops with detachment/count guards, plus
      # whole-activity deletes for phantom records; safe to run on every
      # sync because non-allowlisted tracks are never touched.
      - name: Remove known GPS drift artifacts
        if: steps.change.outputs.rebuild == 'true'
        run: |
          python run_page/fix_gps_drift_rh.py \
            --json src/static/activities.json \
            --db run_page/data.db \
            --drop 232036223:0@264 \
            --drop 9223370520777606807:1 \
            --drop 20285755:1@191 \
            --delete 9223370440357779707

      # Place records the watch never geocoded from their own GPS track, then
      # compare the published JSON with the DB it was built from. Both are
      # idempotent: the resolver only ever fills an empty location, and the
      # check only reads. They run last so the artefacts above (SVG charts,
      # README stats, parquet) are already derived, and the commit captures
      # whatever the resolver added.
      - name: Resolve locations from tracks
        if: steps.change.outputs.rebuild == 'true'
        run: python run_page/resolve_locations_rh.py --execute

      - name: Check dataset integrity
        if: steps.change.outputs.rebuild == 'true'
        run: python run_page/check_data_integrity_rh.py --sport running

      - name: Commit new runs
        id: commit
        if: steps.change.outputs.rebuild == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync runs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin master
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy page
    needs: sync
    # Publish only when the data commit changed something, or when a human
    # pushed UI/code. The bot's own data commit must not rebuild the page a
    # second time: its author is the action bot, whatever it writes in the
    # message — asking the author is sturdier than matching a message.
    if: |
      needs.sync.outputs.changed == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.head_commit.author.email != 'action@github.com')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # always build the tip of the publishing branch, whatever triggered
          # the run
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: PATH_PREFIX=/${{ github.event.repository.name }} pnpm build

      - name: Verify the build
        # The gate before publishing: the page must exist, every asset it
        # asks for must be in the build, the geometry must sit in its
        # per-year files and no caption of another sport may have survived.
        run: SITE_SPORT=running node scripts/verify-dist.mjs

      - name: Smoke-test the page in a real browser
        # The shared navigation and the shared theme are the same on all four
        # sites: a change to the header or to the theme tokens can break them
        # all at once. This runs on the built files, i.e. exactly what ships.
        run: |
          set -o pipefail
          # playwright-core is installed outside the project: it is not a
          # dependency of the page, and npm cannot add it to a pnpm project.
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-fund --no-audit playwright-core
          npx playwright-core install --with-deps chromium-headless-shell
          SHELL_BIN="$(find "$HOME/.cache/ms-playwright" -type f \
            \( -name chrome-headless-shell -o -name headless_shell \) | head -n1)"
          test -n "$SHELL_BIN"
          cd "$GITHUB_WORKSPACE"
          BROWSER_PATH="$SHELL_BIN" NODE_PATH="$RUNNER_TEMP/pw/node_modules" \
            node scripts/smoke-theme.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Wait for the artifact to be visible
        # upload-pages-artifact finalises the upload, but the run's artifact
        # list can lag a moment behind it — deploy-pages reads that list and
        # fails when it is still empty. Poll it instead of racing the API.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            found=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              | python3 -c "import json,sys; print(sum(1 for a in json.load(sys.stdin).get('artifacts', []) if a['name'] == 'github-pages'))")
            if [ "$found" = "1" ]; then
              echo "artifact github-pages is visible"
              exit 0
            fi
            sleep 5
          done
          echo "artifact github-pages never became visible" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
